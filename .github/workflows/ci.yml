name: Code checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Codecov OIDC authentication without repository secrets

concurrency:
  group: code-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python syntax, lint, and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install lightweight test dependencies
        run: |
          mapfile -t api_requirements < <(sed -n -E '/^(fastapi|pydantic)==/p' requirements.txt)
          python -m pip install --disable-pip-version-check \
            "${api_requirements[@]}" \
            "numpy==2.4.6" "pandas==3.0.3" "scikit-learn==1.9.0" \
            "pytest>=8,<10" "pytest-cov>=5,<8" "ruff==0.14.14"

      - name: Check Python syntax
        run: python -m compileall -q src web/backend tests

      - name: Check critical Python errors
        run: ruff check --select E4,E7,E9,F63,F7,F82 src web/backend tests

      - name: Run fast unit tests with coverage
        run: python -m pytest -q tests --ignore=tests/integration --cov=src --cov=web.backend --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          use_oidc: true
          fail_ci_if_error: true

      - name: Install integration test dependencies
        run: |
          torch_requirement="$(sed -n '/^torch==/p' requirements.txt)"
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu "${torch_requirement}+cpu"
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run baseline integration tests
        run: python -m unittest discover -s tests/integration -v
