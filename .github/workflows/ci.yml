name: Code checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python syntax, lint, and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.4.6" "pandas==3.0.3" "scikit-learn==1.9.0" \
            "pytest>=8,<10" "ruff==0.14.14"

      - name: Check Python syntax
        run: python -m compileall -q src web/backend tests

      - name: Check critical Python errors
        run: ruff check --select E4,E7,E9,F63,F7,F82 src web/backend tests

      - name: Run fast unit tests
        run: python -m pytest -q tests
