name: Experiment
description: Define a reproducible experiment and how to evaluate it
title: "[Experiment] "
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Question or hypothesis
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup and baseline
      description: Data split, parameters, environment, and comparison baseline
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Evaluation metrics and success criteria
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results and next steps
      description: Complete this after running the experiment
